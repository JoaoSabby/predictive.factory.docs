project:
  type: book
  output-dir: _book
  resources:
    - widgets/
    - images/
    - recursos/
  post-render:
    - scripts/busca-offline.R

book:
  title: "predictive.factory"
  subtitle: "Documentação técnica, arquitetura e guias interativos"
  author:
    - name: "João Batista Gonçalves de Brito"
  description: "Documentação técnica, arquitetura e guias interativos da Fábrica Preditiva."
  favicon: images/favicon.png
  search:
    location: sidebar
    type: textbox
  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  sidebar:
    style: floating
    logo: images/icon.png
    collapse-level: 1
  page-footer:
    left: "predictive.factory · Documentação técnica"
    right: "Construído com Quarto · funciona sem internet e sem servidor"
