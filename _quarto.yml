format:
  html:
    theme:
      light: [cosmo, estilo/tema-claro.scss]
      dark: [cyborg, estilo/tema-escuro.scss]
    respect-user-color-scheme: true
    css: estilo/pf.css
    toc: true
    toc-depth: 3
    toc-expand: 2
    toc-title: "Nesta página"
    number-sections: false
    html-math-method: mathml
    code-copy: true
    code-overflow: wrap
    code-link: false
    anchor-sections: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    lightbox: auto
    link-external-newwindow: true
    date-modified: last-modified
    # Ajuste de altura dos iframes (inline para
    # funcionar em qualquer nivel de pasta, inclusive referencia/)
    include-after-body:
      - text: |
          <script>
          /* Script local offline para ajuste automatico de altura dos iframes interativos.
             O widget informa a altura do proprio conteudo via postMessage; o iframe recebe
             exatamente essa altura, o que evita ciclos de crescimento. */
          window.addEventListener('message', function(event){
            var data = event.data;
            if(!data || typeof data.height !== 'number') return;
            var id = null;
            if(data.type === 'pf-widget-resize' && data.id) id = 'frame-' + data.id;
            if(data.type === 'sby-conceptual-resize') id = 'frame-sby-conceptual';
            if(data.type === 'sby-avx512-resize') id = 'frame-sby-avx512';
            if(!id) return;
            var el = document.getElementById(id);
            if(!el) return;
            var target = Math.ceil(data.height);
            var current = el.getBoundingClientRect().height;
            if(Math.abs(current - target) > 4){
              el.style.minHeight = '0';
              el.style.height = target + 'px';
            }
          });
          </script>

lang: pt-BR
date-format: "DD/MM/YYYY"

bibliography: referencias.bib
csl: abnt.csl
link-citations: true

execute:
  eval: false
  echo: true
  warning: false
  message: false
