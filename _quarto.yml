format:
  html:
    theme:
      light: [cosmo, estilo/tema-claro.scss]
      dark: [cyborg, estilo/tema-escuro.scss]
    respect-user-color-scheme: true
    css:
      - estilo/pf.css
      - recursos/fontawesome/css/all.min.css
    toc: true
    toc-depth: 3
    toc-expand: 2
    toc-title: "Nesta página"
    number-sections: false
    # MathML: as formulas sao desenhadas pelo proprio navegador, sem MathJax e sem internet
    html-math-method: mathml
    code-copy: true
    code-overflow: wrap
    code-link: false
    anchor-sections: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    lightbox: auto
    link-external-newwindow: true
    date-modified: last-modified
    include-after-body:
      - file: recursos/ajuste-iframes.html

lang: pt-BR
date-format: "DD/MM/YYYY"

bibliography: referencias.bib
csl: abnt.csl
link-citations: true

execute:
  eval: false
  echo: true
  warning: false
  message: false
